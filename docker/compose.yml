name: mojave

x-db-env: &db-env
  FLYWAY_DB_URL: jdbc:mysql://mysql:3306/mv_mojave?createDatabaseIfNotExist=true
  FLYWAY_DB_USER: root
  FLYWAY_DB_PASSWORD: password
  READ_DB_URL: jdbc:mysql://mysql:3306/mv_mojave?createDatabaseIfNotExist=true
  READ_DB_USER: root
  READ_DB_PASSWORD: password
  READ_DB_CONNECTION_TIMEOUT: "30000"
  READ_DB_VALIDATION_TIMEOUT: "5000"
  READ_DB_MAX_LIFETIME_TIMEOUT: "1800000"
  READ_DB_IDLE_TIMEOUT: "600000"
  READ_DB_KEEPALIVE_TIMEOUT: "300000"
  READ_DB_MIN_POOL_SIZE: "2"
  READ_DB_MAX_POOL_SIZE: "10"
  WRITE_DB_URL: jdbc:mysql://mysql:3306/mv_mojave?createDatabaseIfNotExist=true
  WRITE_DB_USER: root
  WRITE_DB_PASSWORD: password
  WRITE_DB_CONNECTION_TIMEOUT: "30000"
  WRITE_DB_VALIDATION_TIMEOUT: "5000"
  WRITE_DB_MAX_LIFETIME_TIMEOUT: "1800000"
  WRITE_DB_IDLE_TIMEOUT: "600000"
  WRITE_DB_KEEPALIVE_TIMEOUT: "300000"
  WRITE_DB_MIN_POOL_SIZE: "2"
  WRITE_DB_MAX_POOL_SIZE: "10"

x-nats-env: &nats-env
  NATS_SERVERS: nats://nats:4222
  NATS_USERNAME: ""
  NATS_PASSWORD: ""
  NATS_TOKEN: ""
  NATS_CONNECTION_TIMEOUT_MS: "5000"
  NATS_MAX_RECONNECTS: "60"
  NATS_RECONNECT_WAIT_MS: "2000"
  NATS_NO_ECHO: "false"

services:
  mysql:
    image: mysql:8.4
    container_name: mojave-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mv_mojave
    ports:
      - "3306:3306"
    volumes:
      - mojave_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -ppassword --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nats:
    image: nats:2.11-alpine
    container_name: mojave-nats
    restart: unless-stopped
    command:
      - -js
      - -m
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - mojave_nats_data:/data

  mono-core-admin:
    build:
      context: ..
      dockerfile: docker/mono/core/admin/Dockerfile
    container_name: mojave-mono-core-admin
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
    environment:
      <<: *nats-env
      NATS_CONNECTION_NAME: mono-core-admin
      MOJAVE_ADMIN_PORT: "8081"
    ports:
      - "8081:8081"

  mono-core-intercom:
    build:
      context: ..
      dockerfile: docker/mono/core/intercom/Dockerfile
    container_name: mojave-mono-core-intercom
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      <<: [*db-env, *nats-env]
      NATS_CONNECTION_NAME: mono-core-intercom

  mono-core-consumer:
    build:
      context: ..
      dockerfile: docker/mono/core/consumer/Dockerfile
    container_name: mojave-mono-core-consumer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      <<: [*db-env, *nats-env]
      NATS_CONNECTION_NAME: mono-core-consumer

  mono-rail-fspiop:
    build:
      context: ..
      dockerfile: docker/mono/rail/fspiop/Dockerfile
    container_name: mojave-mono-rail-fspiop
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      <<: [*db-env, *nats-env]
      NATS_CONNECTION_NAME: mono-rail-fspiop
      MOJAVE_SERVICE_PORT: "8080"
      FSPIOP_HUB_CODE: HUB
      FSPIOP_FSP_CODE: DFSP1
      FSPIOP_FSP_NAME: Demo FSP
      FSPIOP_CURRENCIES: USD
      FSPIOP_ILP_SECRET: changeme
      FSPIOP_SIGN_JWS: "false"
      FSPIOP_VERIFY_JWS: "false"
      FSPIOP_PRIVATE_KEY_PEM: ""
      FSPIOP_FSPS: DFSP1
      QUOTING_STATEFUL: "false"
      FSPIOP_SERVICE_REQUEST_AGE_MS: "60000"
      FSPIOP_SERVICE_REQUEST_AGE_VERIFICATION: "false"
      TRANSFER_RESERVATION_TIMEOUT_MS: "300000"
      TRANSFER_EXPIRY_TIMEOUT_MS: "300000"
    ports:
      - "8080:8080"

volumes:
  mojave_mysql_data:
  mojave_nats_data:
